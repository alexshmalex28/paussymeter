<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>PAUSSYMETER ⚽</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at center, #242424 0%, #111 60%, #050505 100%);
      color: white;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 650px;
      padding: 25px;
    }

    h1 {
      font-size: clamp(42px, 9vw, 76px);
      margin: 0;
      font-weight: 900;
      letter-spacing: -3px;
      color: #ffde00;
      text-shadow:
        3px 3px 0 #ff3b3b,
        6px 6px 0 #000;
    }

    .subtitle {
      margin-top: 5px;
      color: #aaa;
      font-weight: bold;
      letter-spacing: 3px;
      font-size: 12px;
    }

    h2 {
      margin: 30px 0 20px;
      font-size: 24px;
    }

    /* =========================
       WHEEL
    ========================= */

    .wheel-wrapper {
      position: relative;
      width: min(82vw, 430px);
      height: min(82vw, 430px);
      margin: 20px auto 30px;
    }

    .wheel {
      position: absolute;
      inset: 0;
      border-radius: 50%;

      /*
        IMPORTANT:

        Conic gradient starts at TOP.

        RED:
        0° - 120°
        PAUSSY

        PURPLE:
        120° - 240°
        GAY

        GREEN:
        240° - 360°
        FOOTBALL LEGEND
      */

      background: conic-gradient(
        #ff3b3b 0deg 120deg,
        #9c27ff 120deg 240deg,
        #16c784 240deg 360deg
      );

      border: 10px solid white;

      box-shadow:
        0 0 0 5px #111,
        0 0 40px rgba(255, 222, 0, .25);
    }

    /* Continuous spinning */

    .wheel.idle {
      animation: idleSpin 4s linear infinite;
    }

    @keyframes idleSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    /* Section separator lines */

    .wheel::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;

      background:
        conic-gradient(
          transparent 0deg 119deg,
          white 119deg 121deg,
          transparent 121deg 239deg,
          white 239deg 241deg,
          transparent 241deg 359deg,
          white 359deg 360deg
        );
    }

    .label {
      position: absolute;
      width: 140px;
      font-size: 20px;
      font-weight: 900;
      text-shadow: 2px 2px 3px #000;
      z-index: 2;
    }

    .label1 {
      top: 24%;
      right: 6%;
      transform: rotate(60deg);
    }

    .label2 {
      bottom: 15%;
      left: 28%;
      transform: rotate(180deg);
    }

    .label3 {
      top: 24%;
      left: 3%;
      transform: rotate(-60deg);
    }

    /* Wheel center */

    .center {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #111;
      border: 6px solid white;

      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);

      z-index: 10;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 30px;
    }

    /* Fixed pointer */

    .pointer {
      position: absolute;
      top: -20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;

      width: 0;
      height: 0;

      border-left: 22px solid transparent;
      border-right: 22px solid transparent;
      border-top: 55px solid #ffde00;

      filter: drop-shadow(0 4px 3px #000);
    }

    /* =========================
       BUTTONS
    ========================= */

    .buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 17px 38px;

      font-size: 20px;
      font-weight: 900;

      cursor: pointer;

      transition:
        transform .15s,
        filter .15s;

      box-shadow: 0 7px 0 rgba(0,0,0,.45);
    }

    button:hover {
      transform: translateY(-2px) scale(1.04);
      filter: brightness(1.1);
    }

    button:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 rgba(0,0,0,.45);
    }

    .yes {
      background: #16c784;
      color: white;
    }

    .no {
      background: #ff3b3b;
      color: white;
    }

    /* =========================
       RESULT
    ========================= */

    .result {
      min-height: 70px;
      margin-top: 25px;

      font-size: clamp(25px, 6vw, 42px);
      font-weight: 900;

      color: #ffde00;

      text-shadow: 3px 3px 0 #000;
    }

    .result.show {
      animation: resultPop .6s ease;
    }

    @keyframes resultPop {

      0% {
        transform: scale(.3) rotate(-8deg);
        opacity: 0;
      }

      60% {
        transform: scale(1.25) rotate(3deg);
      }

      100% {
        transform: scale(1);
        opacity: 1;
      }
    }

    .hidden {
      display: none;
    }

    .again {
      margin-top: 15px;
      background: #ffde00;
      color: #111;
      font-size: 16px;
      padding: 13px 25px;
    }

    .footer {
      margin-top: 30px;
      color: #555;
      font-size: 11px;
    }

    /* Shake */

    .shake {
      animation: shake .45s;
    }

    @keyframes shake {

      0% {
        transform: translate(0);
      }

      20% {
        transform: translate(-8px, 4px);
      }

      40% {
        transform: translate(8px, -4px);
      }

      60% {
        transform: translate(-6px, 2px);
      }

      80% {
        transform: translate(6px, -2px);
      }

      100% {
        transform: translate(0);
      }
    }

    @media (max-width: 500px) {

      .container {
        padding: 15px;
      }

      h2 {
        font-size: 19px;
      }

      .label {
        font-size: 15px;
        width: 110px;
      }

      button {
        padding: 15px 28px;
      }
    }
  </style>
</head>


<body>

<div class="container" id="container">

  <h1>PAUSSYMETER</h1>

  <div class="subtitle">
    THURSDAY FOOTBALL DETECTOR 2026
  </div>

  <h2>
    Are you playing Thursday night football?
  </h2>


  <div class="wheel-wrapper">

    <div class="pointer"></div>

    <div class="wheel idle" id="wheel">

      <div class="label label1">
        YOU ARE<br>PAUSSY
      </div>

      <div class="label label2">
        YOU ARE<br>GAY
      </div>

      <div class="label label3">
        ⚽ FOOTBALL<br>LEGEND
      </div>

      <div class="center">
        ⚽
      </div>

    </div>

  </div>


  <div class="buttons" id="buttons">

    <button
      class="yes"
      onclick="answerYes()">
      YES ⚽
    </button>

    <button
      class="no"
      onclick="answerNo()">
      NO
    </button>

  </div>


  <div
    class="result"
    id="result">
  </div>


  <button
    class="again hidden"
    id="again"
    onclick="resetGame()">
    TRY AGAIN
  </button>


  <div class="footer">
    Scientifically inaccurate. Footballistically correct.
  </div>

</div>


<script>

  const wheel =
    document.getElementById("wheel");

  const result =
    document.getElementById("result");

  const buttons =
    document.getElementById("buttons");

  const again =
    document.getElementById("again");

  const container =
    document.getElementById("container");


  let spinning = false;


  /*
   ==============================
   RESULT POSITIONS
   ==============================

   These are the CENTER angles of
   the three sections.

   PAUSSY:
   segment center = 60°

   GAY:
   segment center = 180°

   FOOTBALL:
   segment center = 300°

   Because the POINTER stays at 0°
   at the top, we rotate the wheel
   in the OPPOSITE direction.

   Therefore:

   PAUSSY -> rotation 300°
   GAY -> rotation 180°
   FOOTBALL -> rotation 60°
  */


  const positions = {

    paussy: 300,

    gay: 180,

    football: 60

  };


  /*
   Get current visual rotation
  */

  function getCurrentRotation() {

    const style =
      window.getComputedStyle(wheel);

    const transform =
      style.transform;


    if (
      !transform ||
      transform === "none"
    ) {

      return 0;

    }


    const values =
      transform.match(
        /matrix\((.+)\)/
      );


    if (!values) {

      return 0;

    }


    const parts =
      values[1].split(",");


    const a =
      parseFloat(parts[0]);

    const b =
      parseFloat(parts[1]);


    let angle =
      Math.atan2(b, a) *
      (180 / Math.PI);


    if (angle < 0) {

      angle += 360;

    }


    return angle;

  }


  /*
   Spin to selected result
  */

  function spinToResult(
    resultType,
    callback
  ) {

    if (spinning) {

      return;

    }


    spinning = true;

    buttons.style.pointerEvents =
      "none";


    /*
     Capture current angle while
     idle animation is running.
    */

    const currentAngle =
      getCurrentRotation();


    /*
     Stop idle animation.
    */

    wheel.classList.remove("idle");


    wheel.style.transform =
      `rotate(${currentAngle}deg)`;


    wheel.style.transition =
      "none";


    /*
     Force browser refresh
    */

    void wheel.offsetWidth;


    /*
     Desired final wheel angle.
    */

    const desiredAngle =
      positions[resultType];


    /*
     Calculate how far we need
     to rotate from current angle
     to desired angle.
    */

    let difference =
      desiredAngle -
      currentAngle;


    if (difference < 0) {

      difference += 360;

    }


    /*
     Add several full rotations.
    */

    const extraSpins =
      5 +
      Math.floor(
        Math.random() * 3
      );


    /*
     Tiny randomness INSIDE
     the selected section.

     Maximum +/- 25 degrees means
     it stays well away from borders.
    */

    const landingVariation =
      Math.floor(
        Math.random() * 51
      ) - 25;


    const finalRotation =
      currentAngle +
      (extraSpins * 360) +
      difference +
      landingVariation;


    /*
     Start dramatic slowdown.
    */

    wheel.style.transition =
      "transform 4.5s cubic-bezier(.12,.72,.15,1)";


    wheel.style.transform =
      `rotate(${finalRotation}deg)`;


    /*
     Reveal result after wheel stops.
    */

    setTimeout(() => {

      spinning = false;

      buttons.classList.add(
        "hidden"
      );

      callback();

    }, 4600);

  }


  /*
   ==============================
   YES
   ==============================
  */

  function answerYes() {

    result.textContent =
      "CALCULATING FOOTBALL LEVEL...";


    spinToResult(
      "football",
      () => {

        showResult(
          "GREAT! SEE YOU ON THE PITCH ⚽🔥"
        );

        confetti();

      }
    );

  }


  /*
   ==============================
   NO
   ==============================
  */

  function answerNo() {

    result.textContent =
      "ANALYSING EXCUSE...";


    /*
     Random 50 / 50 result.
    */

    const selectedResult =
      Math.random() < 0.5
        ? "paussy"
        : "gay";


    if (
      selectedResult === "paussy"
    ) {

      spinToResult(
        "paussy",
        () => {

          showResult(
            "RESULT: YOU ARE PAUSSY 😭"
          );

          shakeScreen();

        }
      );

    }

    else {

      spinToResult(
        "gay",
        () => {

          showResult(
            "RESULT: YOU ARE GAY 🌈"
          );

          shakeScreen();

        }
      );

    }

  }


  /*
   Show text result
  */

  function showResult(text) {

    result.textContent =
      text;


    result.classList.remove(
      "show"
    );


    void result.offsetWidth;


    result.classList.add(
      "show"
    );


    again.classList.remove(
      "hidden"
    );

  }


  /*
   Shake effect
  */

  function shakeScreen() {

    container.classList.remove(
      "shake"
    );


    void container.offsetWidth;


    container.classList.add(
      "shake"
    );

  }


  /*
   Confetti
  */

  function confetti() {

    for (
      let i = 0;
      i < 50;
      i++
    ) {

      const piece =
        document.createElement(
          "div"
        );


      piece.style.position =
        "fixed";


      piece.style.left =
        Math.random() *
        100 +
        "vw";


      piece.style.top =
        "-20px";


      piece.style.width =
        "8px";


      piece.style.height =
        "15px";


      piece.style.background =
        `hsl(${
          Math.random() * 360
        },100%,50%)`;


      piece.style.zIndex =
        "9999";


      piece.style.transform =
        `rotate(${
          Math.random() * 360
        }deg)`;


      piece.style.transition =
        `top ${
          2 + Math.random() * 2
        }s linear,
        transform ${
          2 + Math.random() * 2
        }s linear`;


      document.body.appendChild(
        piece
      );


      setTimeout(() => {

        piece.style.top =
          "110vh";


        piece.style.transform =
          `rotate(${
            720 +
            Math.random() * 720
          }deg)`;

      }, 20);


      setTimeout(() => {

        piece.remove();

      }, 4500);

    }

  }


  /*
   ==============================
   TRY AGAIN
   ==============================
  */

  function resetGame() {

    result.textContent =
      "";


    result.classList.remove(
      "show"
    );


    buttons.classList.remove(
      "hidden"
    );


    buttons.style.pointerEvents =
      "auto";


    again.classList.add(
      "hidden"
    );


    /*
     Remove final-spin settings.
    */

    wheel.style.transition =
      "none";


    wheel.style.transform =
      "";


    void wheel.offsetWidth;


    /*
     Start endless spinning again.
    */

    wheel.classList.add(
      "idle"
    );

  }

</script>

</body>
</html>
